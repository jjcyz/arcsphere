input {
  # TCP input for receiving logs from the application
  tcp {
    port => 5000
    codec => json
  }

  # UDP input for receiving logs from the application
  udp {
    port => 5000
    codec => json
  }

  # Beats input for filebeat (if used)
  beats {
    port => 5044
  }
}

filter {
  # Parse timestamp
  if [@timestamp] {
    date {
      match => [ "@timestamp", "ISO8601" ]
    }
  }

  # Add service name if not present
  if ![service] {
    mutate {
      add_field => { "service" => "arcsphere" }
    }
  }

  # Parse user interactions
  if [type] == "user_interaction" {
    mutate {
      add_tag => [ "user_interaction" ]
    }
  }

  # Parse AI responses
  if [type] == "ai_response" {
    mutate {
      add_tag => [ "ai_response" ]
    }

    # Calculate response time if available
    if [metadata] and [metadata][responseTime] {
      mutate {
        add_field => { "response_time_ms" => "%{[metadata][responseTime]}" }
      }
    }
  }

  # Parse system events
  if [type] == "system_event" {
    mutate {
      add_tag => [ "system_event" ]
    }
  }

  # Add environment information
  mutate {
    add_field => { "environment" => "development" }
  }

  # Remove sensitive information
  mutate {
    remove_field => [ "password", "api_key", "token" ]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "arcsphere-logs-%{+YYYY.MM.dd}"
    template_name => "arcsphere-logs"
    template => {
      "index_patterns" => ["arcsphere-logs-*"]
      "settings" => {
        "number_of_shards" => 1
        "number_of_replicas" => 0
      }
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "level" => { "type" => "keyword" }
          "message" => { "type" => "text" }
          "service" => { "type" => "keyword" }
          "type" => { "type" => "keyword" }
          "userId" => { "type" => "keyword" }
          "requestId" => { "type" => "keyword" }
          "method" => { "type" => "keyword" }
          "url" => { "type" => "keyword" }
          "statusCode" => { "type" => "integer" }
          "responseTime" => { "type" => "float" }
          "userAgent" => { "type" => "text" }
          "ip" => { "type" => "ip" }
          "model" => { "type" => "keyword" }
          "promptLength" => { "type" => "integer" }
          "responseLength" => { "type" => "integer" }
          "eventType" => { "type" => "keyword" }
          "environment" => { "type" => "keyword" }
        }
      }
    }
  }

  # Output to stdout for debugging (optional)
  stdout {
    codec => rubydebug
  }
}
